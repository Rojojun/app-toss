name: Deploy backend to home server

on:
  push:
    branches: [prod-back]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-home
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/prod-back'
    uses: ./.github/workflows/backend-check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: [self-hosted, linux, houselink]
    environment: home-production
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Isolate registry credentials
        run: echo "DOCKER_CONFIG=$RUNNER_TEMP/houselink-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace application and check health
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          APP_ENV_FILE: ${{ vars.APP_ENV_FILE }}
          APP_CERTS_DIR: ${{ vars.APP_CERTS_DIR }}
          APP_HOST_PORT: ${{ vars.APP_HOST_PORT }}
        run: bash scripts/deploy-home.sh "$IMAGE"
