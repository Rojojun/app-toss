# 백엔드 테스트와 프론트 빌드를 돌린다. 룰셋의 필수 체크는 마지막 job 인 "ci" 하나만 본다.
# 비밀값을 쓰지 않으므로 fork 에서 온 PR 에서도 안전하게 돈다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  ci:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = "success"; done
