        id:
          type: string
          format: uuid
        name:
          type: string
        myRole:
          $ref: '#/components/schemas/HouseholdRole'
        myNickname:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
        createdAt:
          type: string
          format: date-time
    Membership:
      type: object
      required: [householdId, userId, nickname, role, joinedAt]
      properties:
        householdId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        nickname:
          type: string
        role:
          $ref: '#/components/schemas/HouseholdRole'
        joinedAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      required: [maxUses, expiresInHours]
