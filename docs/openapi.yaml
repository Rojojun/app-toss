    UpdateHouseholdRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    NicknameRequest:
      type: object
      required: [nickname]
      additionalProperties: false
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
    AcceptInvitationRequest:
      type: object
      required: [nickname]
      additionalProperties: false
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 20
