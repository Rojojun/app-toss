        householdId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        maxUses:
          type: integer
        usedCount:
          type: integer
          example: 0
    InvitationPreview:
      type: object
      required: [householdName, expiresAt, remainingUses]
      properties:
        householdName:
          type: string
        expiresAt:
          type: string
          format: date-time
        remainingUses:
          type: integer
    CreateItemRequest:
      type: object
      required: [name, category, unit, quantity, lowStockThreshold]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/ItemCategory'
        unit:
          type: string
          minLength: 1
          maxLength: 20
          description: 수량 뒤에 붙는 말(개, 롤 등). 숫자는 쓸 수 없다(400 VALIDATION_ERROR, details.unit).
        quantity:
          type: integer
          format: int32
          minimum: 0
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0
    UpdateItemRequest:
      type: object
      required: [expectedVersion]
      additionalProperties: false
      minProperties: 2
      description: expectedVersion 외 필드를 하나 이상 포함한다.
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        name:
          type: string
          minLength: 1
          maxLength: 100
        category:
          $ref: '#/components/schemas/ItemCategory'
        unit:
          type: string
          minLength: 1
          maxLength: 20
          description: 수량 뒤에 붙는 말(개, 롤 등). 숫자는 쓸 수 없다(400 VALIDATION_ERROR, details.unit).
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0
    ItemCategory:
      type: string
      enum: [TOILETRIES, CLEANING, LAUNDRY, KITCHEN, OTHER]
      description: 아이콘 선택용 고정 카테고리
    Item:
      type: object
      required: [id, householdId, name, category, unit, quantity, lowStockThreshold, lowStock, version]
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        name:
          type: string
        category:
          $ref: '#/components/schemas/ItemCategory'
        unit:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 0
        lowStockThreshold:
          type: integer
          format: int32
          minimum: 0
        lowStock:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
    ChangeStockRequest:
      type: object
      required: [expectedVersion, newQuantity]
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
        newQuantity:
          type: integer
          format: int32
          minimum: 0
    ChangeStockResponse:
      type: object
      required: [item, stockChange]
      properties:
        item:
          $ref: '#/components/schemas/Item'
        stockChange:
          $ref: '#/components/schemas/StockChange'
    StockChange:
      type: object
      required: [id, itemId, actorUserId, actorNickname, beforeQuantity, afterQuantity, createdAt]
      properties:
        id:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        actorNickname:
          type: string
          description: 변경한 시점의 닉네임. 이후 이름을 바꾸거나 공간을 나가도 유지된다.
        beforeQuantity:
          type: integer
          minimum: 0
        afterQuantity:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
    PutAlertPreferenceRequest:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
    AlertPreference:
      type: object
      required: [householdId, enabled]
      properties:
        householdId:
          type: string
          format: uuid
        enabled:
          type: boolean
